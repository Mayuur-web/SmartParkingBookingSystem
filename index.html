<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Parking Booking System | Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>🅿️ Smart Parking</h1>
      <p class="tag">Find. Book. Park. Hassle-free.</p>
      <p style="margin-bottom:18px"><a href="home.html" style="font-size:12px;color:var(--primary-light)">← Back to Home</a></p>

      <div class="tabs">
        <button id="tab-login" class="active">Login</button>
        <button id="tab-signup">Sign Up</button>
      </div>

      <form id="loginForm">
        <div class="error-msg" id="loginError"></div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button class="btn" type="submit">Login</button>
        <p class="hint">Admin demo: admin@parking.com / admin123</p>
      </form>

      <form id="signupForm" style="display:none">
        <div class="error-msg" id="signupError"></div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="suName" required placeholder="Jane Doe" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="suEmail" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="suPassword" required minlength="4" placeholder="••••••••" />
        </div>
        <button class="btn" type="submit">Create Account</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script>initAuthPage();</script>
</body>
</html>

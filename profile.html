<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Profile | Smart Parking</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="navbar">
    <div class="brand">🅿️ Smart Parking</div>
    <div class="nav-right">
      <a href="dashboard.html" style="color:#fff">Dashboard</a>
      <a href="my-bookings.html" style="color:#fff">My Bookings</a>
      <a href="profile.html" style="color:#fff">Profile</a>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="container" style="max-width:640px">
    <div class="page-title">My Profile</div>
    <div class="page-sub">View and update your account details.</div>

    <div class="section-card">
      <div class="profile-header">
        <div class="avatar-circle" id="avatarInitial">U</div>
        <div>
          <div style="font-weight:700; font-size:17px" id="profileNameDisplay">Loading...</div>
          <div style="color:var(--muted); font-size:13px">Registered User</div>
        </div>
      </div>

      <div class="stats-row" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-card"><div class="num" id="statTotalBookings">0</div><div class="lbl">Total Bookings</div></div>
        <div class="stat-card"><div class="num" id="statActiveBookings">0</div><div class="lbl">Active</div></div>
        <div class="stat-card"><div class="num" id="statTotalSpent">₹0</div><div class="lbl">Total Spent</div></div>
      </div>

      <div class="success-msg" id="profileSuccess" style="display:none">Profile updated successfully.</div>
      <form id="profileForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="profileName" required />
        </div>
        <div class="form-group">
          <label>Email (cannot be changed)</label>
          <input type="email" id="profileEmail" disabled style="background:#f4f6f7" />
        </div>
        <button class="btn" type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    initProfile();
    document.getElementById("profileForm").addEventListener("submit", () => {
      setTimeout(() => {
        document.getElementById("profileNameDisplay").textContent = document.getElementById("profileName").value;
        document.getElementById("avatarInitial").textContent = document.getElementById("profileName").value.charAt(0).toUpperCase();
      }, 0);
    });
  </script>
</body>
</html>
